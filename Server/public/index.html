        }
        
        function openNavUpdate() {
            if(document.getElementById("mySidepanelUpdate").style.width == "0px" || document.getElementById("mySidepanelUpdate").style.width == ""){

    <script>
        const isEmpty = (obj) => Object.keys(obj).length === 0;

        document.getElementById('search').addEventListener('click', (event) => {
            const getParameters = {};

            // Player Character Update
            
            //The document.getElementById('character_name') needs to use the id of the form element
            if (document.getElementById('character_name').value.length !== 0) {
                //parameters.character_name will turn into example.com/?character_name=XXXX
                getParameters.character_name = document.getElementById('character_name').value;
            }

            //The document.getElementById('race') needs to use the id of the form element
            if (document.getElementById('race').value.length !== 0) {
                getParameters.race = document.getElementById('race').value;
            }

            //The document.getElementById('class') needs to use the id of the form element
            if (document.getElementById('class').value.length !== 0) {
                getParameters.class = document.getElementById('class').value;
            }

            //The document.getElementById('level') needs to use the id of the form element
            if (document.getElementById('level').value.length !== 0) {
                getParameters.level = document.getElementById('level').value;
            }
            
            // Player Stats Update

            if (document.getElementById('strength').value.length !== 0) {
                getParameters.strength = document.getElementById('strength').value;
            }

            if (document.getElementById('dexterity').value.length !== 0) {
                getParameters.dexterity = document.getElementById('dexterity').value;
            }

            if (document.getElementById('constitution').value.length !== 0) {
                getParameters.constitution = document.getElementById('constitution').value;
            }

            if (document.getElementById('intelligence').value.length !== 0) {
                getParameters.intelligence = document.getElementById('intelligence').value;
            }

            if (document.getElementById('wisdom').value.length !== 0) {
                getParameters.wisdom = document.getElementById('wisdom').value;
            }

            if (document.getElementById('charisma').value.length !== 0) {
                getParameters.charisma = document.getElementById('charisma').value;
            }

            // Sorting/Limiting
            
            if (document.getElementById('limit').value.length !== 0) {
                getParameters.limit = document.getElementById('limit').value;
            }
            
            if (document.getElementById('sort').value.length !== 0) {
                console.log("Made it to sort");
                getParameters.sort = document.getElementById('sort').value;
            }

            //Settings for FETCH API request
            let fetchSettings = {
                method: 'GET'
            };

            //Send FETCH API request
            fetch("/playercharacters/" + (!isEmpty(getParameters) ? "?" + new URLSearchParams(getParameters) : ""), fetchSettings)
                .then((response) => {
                    return new Promise((resolve) => response.json()
                        .then((json) => resolve({
                            status: response.status,
                            json,
                        })
                    ));
                })
                //Logic to display errors on form 
                .then(({ status, json }) => {
                    if (status === 200) {
                        let displayTable = 
                        '<div class="container">' +
                            '<div class="row">' + 
                            '<div class="col-md-1>' +
                            '<div class="col-md-10>' +
                            '<table>' +
                                    '<thead>' +
                                        '<tr>' +
                                            '<th width="10%"">Character Name</th>' +
                                            '<th width="10%">Race</th>' +
                                            '<th width="10%">Class</th>' +
                                            '<th width="10%">Level</th>' +
                                            '<th width="10%">Strength</th>' +
                                            '<th width="10%">Dexterity</th>' +
                                            '<th width="10%">Consitution</th>' +
                                            '<th width="10%">Intelligence</th>' +
                                            '<th width="10%">Wisdom</th>' +
                                            '<th width="10%">Charisma</th>' +
                                        '</tr>' +
                                    '</thead>' +
                                '<tbody>';
                        if (typeof json.data !== 'undefined') {
                            for (row of json.data) {
                                displayTable += 
                                        '<tr>' +
                                            '<td class="tableRowLeft">' + row.character_name + '</td>' +
                                            '<td>' + row.race + '</td>' +
                                            '<td>' + row.class + '</td>' +
                                            '<td>' + row.level + '</td>' +
                                            '<td>' + row.strength + '</td>' +
                                            '<td>' + row.dexterity + '</td>' +
                                            '<td>' + row.constitution + '</td>' +
                                            '<td>' + row.intelligence + '</td>' +
                                            '<td>' + row.wisdom + '</td>' +
                                            '<td class="tableRowRight">' + row.charisma + '</td>' +
                                        '</tr>';
                            }
                        }
                        displayTable += '</tbody></table></div></div></div>';
                        document.getElementById('characters').innerHTML = displayTable;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });               

        document.getElementById('insertCharacter').addEventListener('click', (event) => {
            const formData = new FormData();
            
            //Collect form data with correct parameter names
            if (document.getElementById('character_name_insert').value.length !== 0) {
                formData.append('character_name_insert', document.getElementById('character_name_insert').value);
            }

            if (document.getElementById('character_race_insert').value.length !== 0) {
                formData.append('character_race_insert', document.getElementById('character_race_insert').value);
            }

            if (document.getElementById('character_class_insert').value.length !== 0) {
                formData.append('character_class_insert', document.getElementById('character_class_insert').value);
            }

            if (document.getElementById('character_level_insert').value.length !== 0) {
                formData.append('character_level_insert', document.getElementById('character_level_insert').value);
            }
            
            // Player Stats

            if (document.getElementById('character_strength_insert').value.length !== 0) {
                formData.append('character_strength_insert', document.getElementById('character_strength_insert').value);
            }

            if (document.getElementById('character_dexterity_insert').value.length !== 0) {
                formData.append('character_dexterity_insert', document.getElementById('character_dexterity_insert').value);
            }

            if (document.getElementById('character_constitution_insert').value.length !== 0) {
                formData.append('character_constitution_insert', document.getElementById('character_constitution_insert').value);
            }

            if (document.getElementById('character_intelligence_insert').value.length !== 0) {
                formData.append('character_intelligence_insert', document.getElementById('character_intelligence_insert').value);
            }

            if (document.getElementById('character_wisdom_insert').value.length !== 0) {
                formData.append('character_wisdom_insert', document.getElementById('character_wisdom_insert').value);
            }

            if (document.getElementById('character_charisma_insert').value.length !== 0) {
                formData.append('character_charisma_insert', document.getElementById('character_charisma_insert').value);
            }

            //Settings for FETCH API request
            let fetchSettings = {
                method: 'POST',
                body: formData
            };

            //Send FETCH API request
            fetch("http://localhost/playercharacters/", fetchSettings)
                .then((response) => {
                    return new Promise((resolve) => response.json()
                        .then((json) => resolve({
                            status: response.status,
                            json,
                        })
                    ));
                })
                .then(({ status, json }) => {
                    if (status === 200 || status === 400) {
                        console.log("Response:", json);
                        alert(json.message || 'Character Insert processed');
                    }
                    if(status === 400){
                        for(error of json.errors){
                            alert(error.msg);
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });   
        
        document.getElementById('updateCharacter').addEventListener('click', (event) => {
            const formData = new FormData();
            
            if (document.getElementById('character_originalName_update').value.length !== 0) {
                formData.append('character_originalName_update', document.getElementById('character_originalName_update').value);
            }

            //Collect form data with correct parameter names
            if (document.getElementById('character_name_update').value.length !== 0) {
                formData.append('character_name_update', document.getElementById('character_name_update').value);
            }

            if (document.getElementById('character_race_update').value.length !== 0) {
                formData.append('character_race_update', document.getElementById('character_race_update').value);
            }

            if (document.getElementById('character_class_update').value.length !== 0) {
                formData.append('character_class_update', document.getElementById('character_class_update').value);
            }

            if (document.getElementById('character_level_update').value.length !== 0) {
                formData.append('character_level_update', document.getElementById('character_level_update').value);
            }
            
            // Player Stats

            if (document.getElementById('character_strength_update').value.length !== 0) {
                formData.append('character_strength_update', document.getElementById('character_strength_update').value);
            }

            if (document.getElementById('character_dexterity_update').value.length !== 0) {
                formData.append('character_dexterity_update', document.getElementById('character_dexterity_update').value);
            }

            if (document.getElementById('character_constitution_update').value.length !== 0) {
                formData.append('character_constitution_update', document.getElementById('character_constitution_update').value);
            }

            if (document.getElementById('character_intelligence_update').value.length !== 0) {
                formData.append('character_intelligence_update', document.getElementById('character_intelligence_update').value);
            }

            if (document.getElementById('character_wisdom_update').value.length !== 0) {
                formData.append('character_wisdom_update', document.getElementById('character_wisdom_update').value);
            }

            if (document.getElementById('character_charisma_update').value.length !== 0) {
                formData.append('character_charisma_update', document.getElementById('character_charisma_update').value);
            }

            //Settings for FETCH API request
            let fetchSettings = {
                method: 'PUT',
                body: formData
            };

            //Send FETCH API request
            fetch("http://localhost/playercharacters/", fetchSettings)
                .then((response) => {
                    return new Promise((resolve) => response.json()
                        .then((json) => resolve({
                            status: response.status,
                            json,
                        })
                    ));
                })
                .then(({ status, json }) => {
                    if (status === 200 || status === 400) {
                        console.log("Response:", json);
                        alert(json.message || 'Character update processed');
                    }
                    if(status === 400){
                        for(error of json.errors){
                            alert(error.msg);
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });   
    </script>
</body>

</html>
